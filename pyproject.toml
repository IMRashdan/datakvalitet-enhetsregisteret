[project]
name = "datakvalitet-enhetsregisteret"
version = "0.1.0"
description = "Datakvalitetsanalyse av Enhetsregisteret med Python og DuckDB"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
